<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Escrevendo parágrafos de qualquer jeito, precisa apenas colocar tudo no meio do par de tags &lt;p&gt;e &lt;/p&gt;<!--LESS THAN / GREATER THAN--></p>
    <p>Se precisar quebrar o texto em algum lugar específico,<br> pode usar a tag &lt;br&gt;.</p>
    <p>Hora de colocar alguns símbolos especias:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uarr;
    </p>
    <p>Bora colocar emoji:
        &#x1F440;
        &#x1F60E;

    </p>
